name: Publish to GitHub Pages

# Prototype phase: builds and deploys at once, then runs the checks and opens or updates a "main is red" issue if they
# fail, without holding the deploy. At the first release (the `release` playbook) make `build` need `check` instead, so
# main is checked before anything deploys.
on:
  push:
    branches: [main]
    # only what goes into the page: a docs-only merge publishes nothing new
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tools/build.mjs'
      - 'tools/rules.mjs'
      - 'tools/check.mjs'
      - 'tools/checks/**'
      - 'tools/bot.mjs'
      - 'tools/baseline.json'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# The lock is per job, not per run: a deploy never waits behind the previous push's browser checks, and each check
# shard queues on its own. Each queue keeps only its newest waiting run, so a burst of pushes deploys and checks the
# latest main.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/rules.mjs && npm test && node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # the browser checks, after the deploy, as four parallel jobs balanced by time (tools/check.mjs --shard);
  # at the first release make `build` need this job
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: main-check-${{ matrix.shard }}
      cancel-in-progress: false
    # past the limit the job is cancelled, which opens no "main is red" issue, so keep it well clear of a shard's time
    # (about 25 minutes each, balanced by MINUTES in tools/check.mjs)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw-version
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
      - name: Check main
        run: |
          mkdir -p build/check
          set -o pipefail
          (node tools/rules.mjs && npm test && node tools/build.mjs && node tools/check.mjs --shard ${{ matrix.shard }}/4) 2>&1 | tee build/check/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-main-${{ matrix.shard }}
          path: build/check
          if-no-files-found: ignore

  # opens or updates the "main is red" issue when a shard fails, and closes it when all four pass; a cancelled shard
  # (a newer push took its place) reports nothing, since the newer run will
  report:
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: check-main-*
          path: build/check
          merge-multiple: true
      - name: Open, update or close the "main is red" issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.check.result }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const marker = '<!-- main-is-red -->';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', labels: 'bug', per_page: 100});
            const open = issues.filter(i => i.body && i.body.includes(marker));
            if (process.env.RESULT === 'success') {
              for (const i of open) {
                await github.rest.issues.createComment({owner, repo, issue_number: i.number, body: `Green again as of ${now} UTC at ${sha.slice(0, 7)} · [run](${run})`});
                await github.rest.issues.update({owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed'});
              }
              return;
            }
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${sha}`;
            const commitMsg = (context.payload.head_commit && context.payload.head_commit.message || '').split('\n')[0];
            const dir = 'build/check';
            const logs = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => /^shard-\d+\.log$/.test(f)).sort() : [];
            const log = logs.flatMap(f => fs.readFileSync(`${dir}/${f}`, 'utf8').split('\n'));
            const fails = log.filter(l => /^\s*(FAIL|not ok|build:)/.test(l)).map(l => l.trim());
            const body = [marker, '### main is red', '',
              ...fails.slice(0, 10).map(l => '- ' + l.replace(/^FAIL\s+/, '')),
              ...(fails.length > 10 ? [`- and ${fails.length - 10} more`] : []),
              ...(fails.length ? [] : ['- a check job failed before its checks ran: see the run']),
              '', `Broken by [${sha.slice(0, 7)}](${commitUrl})${commitMsg ? ': ' + commitMsg : ''}`,
              '', `Checked ${now} UTC · [run](${run})`].join('\n');
            const existing = open[0];
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body: `Still red as of ${now} UTC · [run](${run})`});
            } else {
              await github.rest.issues.create({owner, repo, title: 'main is red', body, labels: ['bug']});
            }
