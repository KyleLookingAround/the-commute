name: Publish to GitHub Pages

# Prototype phase: builds and deploys at once on every push. The browser checks run in their own workflow, Check main
# (main-check.yml), and open or update a "main is red" issue if they fail, without holding the deploy. At the first
# release (the `release` playbook) make `build` need the checks instead, so main is checked before anything deploys.
on:
  push:
    branches: [main]
    # only what goes into the page: a docs-only merge publishes nothing new
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tools/build.mjs'
      - 'tools/rules.mjs'
      - 'tools/check.mjs'
      - 'tools/lines.mjs'
      - 'tools/checks/**'
      - 'tools/bot.mjs'
      - 'tools/baseline.json'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The deploy's lock is its own: a deploy never waits behind the browser checks.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/rules.mjs && npm test && node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
