# Keeps PR titles and descriptions free of tool attribution, the same patterns as .githooks/commit-msg
# (which does this for commit messages). Separate from checks.yml so editing a description only re-runs
# this fast check, not npm run check.
#
# A PR-opening tool sometimes appends a trailing "Generated by ..." footer of its own on top of ours; before
# checking, this strips a trailing footer of the shape `---` then `_Generated by [...](...)_` (and any blank
# lines around it) from the description with the REST API, and only fails if something still matches after
# that. The title check is unchanged.
name: Description check

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  description:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const rawBody = String(pr.body || '');
            // a trailing "---" then "_Generated by [...](...)_ ", with any blank lines around it
            const footerRe = /(\r?\n[ \t]*)*---[ \t]*(\r?\n[ \t]*)*_Generated by \[[^\]]*\]\([^)]*\)_[ \t]*(\r?\n\s*)*$/i;
            let body = rawBody;
            if (footerRe.test(rawBody)) {
              body = rawBody.replace(footerRe, '');
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body,
              });
            }
            const lines = [
              ['title', pr.title || ''],
              ...body.split('\n').map((l, i) => ['description line ' + (i + 1), l]),
            ];
            // same patterns as .githooks/commit-msg: known attribution shapes, plus a general
            // claude/anthropic mention as a catch-all
            const re = /co-authored-by:.*(claude|anthropic)|claude-session:|generated (with|by) .*claude|claude\.(ai|com)\/|\b(claude|anthropic)\b/i;
            const bad = [];
            for (const [where, line] of lines) {
              if (re.test(line)) bad.push(`${where}: "${line.trim()}"`);
            }
            if (bad.length) {
              core.setFailed(
                'This PR\'s title or description mentions Claude or Anthropic, or carries a tool attribution line:\n' +
                bad.map(b => '- ' + b).join('\n') +
                '\n\nEdit the description to remove it (call CLAUDE.md "the project notes" and .claude/ "editor settings"). ' +
                'No push is needed: editing the description re-runs this check.'
              );
            }
