name: Check main

# The browser checks on main, after every push that can change the page (the Publish workflow deploys it at once).
# One lock for the whole run: a run that has started always finishes, every shard of it, and while it runs only the
# newest push waits (an older waiting run is replaced), so a full check of main up to then finishes every 20 minutes or
# so however fast the pushes come. The report says which commit it checked: that one and every push before it.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tools/build.mjs'
      - 'tools/rules.mjs'
      - 'tools/check.mjs'
      - 'tools/lines.mjs'
      - 'tools/checks/**'
      - 'tools/bot.mjs'
      - 'tools/baseline.json'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: main-check
  cancel-in-progress: false

jobs:
  # the browser checks, alongside the deploy, as eight parallel jobs balanced by time (tools/check.mjs --shard);
  # at the first release make the Publish workflow's `build` wait for them
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # past the limit the job is cancelled, which opens no "main is red" issue, so keep it well clear of a shard's time
    # (about 15 minutes each, balanced by MINUTES in tools/check.mjs)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw-version
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
      - name: Check main
        run: |
          mkdir -p build/check
          set -o pipefail
          (node tools/rules.mjs && npm test && node tools/build.mjs && node tools/check.mjs --shard ${{ matrix.shard }}/8) 2>&1 | tee build/check/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-main-${{ matrix.shard }}
          path: build/check
          if-no-files-found: ignore

  # opens or updates the "main is red" issue when a shard fails, and closes it when all eight pass; a run cancelled
  # by hand reports nothing
  report:
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: check-main-*
          path: build/check
          merge-multiple: true
      - name: Open, update or close the "main is red" issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.check.result }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const marker = '<!-- main-is-red -->';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', labels: 'bug', per_page: 100});
            const open = issues.filter(i => i.body && i.body.includes(marker));
            if (process.env.RESULT === 'success') {
              for (const i of open) {
                await github.rest.issues.createComment({owner, repo, issue_number: i.number, body: `Green again as of ${now} UTC at ${sha.slice(0, 7)} and every push before it · [run](${run})`});
                await github.rest.issues.update({owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed'});
              }
              return;
            }
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${sha}`;
            const commitMsg = (context.payload.head_commit && context.payload.head_commit.message || '').split('\n')[0];
            const dir = 'build/check';
            const logs = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => /^shard-\d+\.log$/.test(f)).sort() : [];
            const log = logs.flatMap(f => fs.readFileSync(`${dir}/${f}`, 'utf8').split('\n'));
            const fails = log.filter(l => /^\s*(FAIL|not ok|build:)/.test(l)).map(l => l.trim());
            const body = [marker, '### main is red', '',
              ...fails.slice(0, 10).map(l => '- ' + l.replace(/^FAIL\s+/, '')),
              ...(fails.length > 10 ? [`- and ${fails.length - 10} more`] : []),
              ...(fails.length ? [] : ['- a check job failed before its checks ran: see the run']),
              '', `Red at [${sha.slice(0, 7)}](${commitUrl})${commitMsg ? ': ' + commitMsg : ''}, with every push to main before it`,
              '', `Checked ${now} UTC · [run](${run})`].join('\n');
            const existing = open[0];
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body: `Still red as of ${now} UTC · [run](${run})`});
            } else {
              await github.rest.issues.create({owner, repo, title: 'main is red', body, labels: ['bug']});
            }
