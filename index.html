<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Commute</title>
<meta name="description" content="Station tycoon on a 3D map of the Stockport to Manchester line.">
<meta name="theme-color" content="#0c1020">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Commute">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;700;800&family=Overpass+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="./src/ui/styles/page.css">
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="gl" aria-label="3D view of the line from Stockport to Manchester Piccadilly. Drag to move, pinch or scroll to zoom, twist with two fingers or right-drag to turn. Arrow keys move, Q and E turn, plus and minus zoom."></canvas>
    <div class="lbls" id="lbls"></div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <header class="top">
    <div class="pill cash" id="cash">£3,000</div>
    <div class="pill" id="clock">Day 1 · 06:30</div>
    <span class="top-gap"></span>
    <button id="vSet" class="rb vset" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
  </header>
  <div class="mins" id="minsKey" hidden><b>Minutes to Manchester</b><span><i style="background:var(--map-mins-1)"></i>&lt;20</span><span><i style="background:var(--map-mins-2)"></i>20–30</span><span><i style="background:var(--map-mins-3)"></i>30–40</span><span><i style="background:var(--map-mins-4)"></i>40–50</span></div>

  <nav class="views" aria-label="Map views">
    <button id="vLine" class="rb lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16c4 0 5-8 9-8s5 8 9 8"/><circle cx="3" cy="16" r="1.6"/><circle cx="21" cy="16" r="1.6"/></svg><small>Line</small></button>
    <button id="vMins" class="rb lb" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg><small>Mins</small></button>
    <button id="vLight" class="rb lb" aria-expanded="false" aria-controls="lightPop"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><small>Light</small></button>
    <button class="rb north" id="vNorth" aria-label="North up" hidden><span id="vNeedle">N</span></button>
  </nav>
  <div class="daylight" id="lightPop" role="group" aria-label="Light" hidden><input id="hour" type="range" min="0" max="24" step="0.25" value="6.5" aria-label="Time of day for the light"><span id="hourLbl">06:30</span><button id="hourLive" hidden>Live</button></div>

  <section class="sheet" id="sheet" data-at="peek" aria-label="Stations and the line">
    <div class="sh-grip" id="sheetGrip">
      <button class="sh-handle" id="sheetHandle" aria-expanded="false"><i aria-hidden="true"></i><b id="shName">Stockport</b><small id="shSub"></small></button>
      <div class="seg speed" role="group" aria-label="Speed"><button id="sp1" aria-pressed="true">1×</button><button id="sp3" aria-pressed="false">3×</button><button id="sp10" aria-pressed="false">10×</button></div>
    </div>
    <div class="sh-peek">
      <div class="buybar" id="buybar" hidden><div class="bb-what"><b id="barName"></b><small id="barAdds"></small></div><button class="bb-x" id="barClose" aria-label="Put it back">✕</button><button class="bb-buy" id="barBuy">Buy</button></div>
      <input class="glide" id="glide" type="range" step="10" aria-label="Glide along the line, from Hazel Grove to Manchester">
      <div class="strip" id="strip"></div>
    </div>
    <div class="sh-tabs" role="tablist" aria-label="Show"><button id="tabStation" role="tab" aria-selected="true" aria-controls="panel">Station</button><button id="tabLine" role="tab" aria-selected="false" aria-controls="linePanel">Line</button></div>
    <div class="sh-body" id="sheetBody">
      <div class="panel" id="panel"></div>
      <div class="panel" id="linePanel" hidden></div>
    </div>
  </section>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
